<!doctype html>
<html lang="{{ page.lang | default: 'uk' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Pihulka Check</title>
  {% if page.alt_url %}<link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ page.alt_url }}">{% endif %}
  <style>
    :root {
      --bg: #FBFCFF; --fg: #1B2333; --muted: #5B6578;
      --line: #DDE3EE; --accent: #2457D6; --soft: #EEF2F8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1524; --fg: #E6EAF2; --muted: #9AA4B8;
        --line: #26314A; --accent: #7AA7FF; --soft: #1A2438;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 600; color: var(--fg); text-decoration: none; }
    a { color: var(--accent); }
    main { padding-bottom: 32px; }
    footer { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    footer a { color: var(--muted); }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 1.5rem 0 .5rem; }
    h2 { font-size: 1.3rem; line-height: 1.3; margin: 2.25rem 0 .75rem; }
    h3 { font-size: 1.1rem; margin: 1.75rem 0 .5rem; }
    code { background: var(--soft); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    ul { padding-left: 1.25rem; }
    li { margin: .25rem 0; }
    /* Wide tables scroll inside themselves instead of widening the page. */
    table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; }
    th, td { border: 1px solid var(--line); padding: .5rem .65rem; text-align: left; vertical-align: top; min-width: 9rem; }
    th { background: var(--soft); }
    code { white-space: nowrap; }
    /* On a phone each table row becomes a card; the column name sits above each value. */
    @media (max-width: 560px) {
      table, tbody, tr, td { display: block; }
      thead { display: none; }
      tr { border: 1px solid var(--line); border-radius: 10px; margin: .75rem 0; padding: .6rem .8rem; }
      td { border: 0; padding: 0; min-width: 0; }
      td:first-child { font-weight: 600; }
      td + td { margin-top: .5rem; }
      td[data-label]:not(:first-child)::before {
        content: attr(data-label); display: block; color: var(--muted);
        font-size: .75rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ page.home | default: '../../' }}">Pihulka Check</a>
    {% if page.alt_url %}<a href="{{ page.alt_url }}" hreflang="{{ page.alt_lang }}" lang="{{ page.alt_lang }}">{{ page.alt_label }}</a>{% endif %}
  </header>
  <main>
{{ content }}
  </main>
  {% assign root = page.home | default: '../../' %}
  <footer>
    {% if page.lang == 'en' %}<a href="{{ root }}en/support/">Support</a> · <a href="{{ root }}en/privacy/">Privacy Policy</a>{% else %}<a href="{{ root }}uk/support/">Підтримка</a> · <a href="{{ root }}uk/privacy/">Політика конфіденційності</a>{% endif %} · <a href="mailto:pihulka.check@gmail.com">pihulka.check@gmail.com</a>
  </footer>
  <script>
    // Column names for the phone layout above, which hides the header row.
    document.querySelectorAll('table').forEach(function (table) {
      var names = Array.prototype.map.call(table.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
      table.querySelectorAll('tbody tr').forEach(function (row) {
        Array.prototype.forEach.call(row.children, function (cell, i) { if (names[i]) cell.setAttribute('data-label', names[i]); });
      });
    });
  </script>
</body>
</html>
